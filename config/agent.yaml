# Agent Manifest — AgentRegistry entry point
# AgentRegistry reads every key at ROOT level. Runtime settings belong in
# config/config.yaml.
id: "LOG-C2-051"
name: "Cargo Claim Preparation Agent"
namespace: "agent1000"
version: "1.0.2"
enabled: true
category: "Cat 2"
generation_mode: "llm"
industry: "LOG"

base_type: "AgentBaseGraph"
class: "src.graph.graph.Graph"

required_trust_level: "VERIFIED_EXTERNAL"

# Policy retrieval and Azure OpenAI credentials are invocation-scoped.
requires:
  secrets:
    - "POLICY_RAG_API_KEY"
    - "POLICY_RAG_ENDPOINT"
    - "AZURE_OPENAI_API_KEY"
    - "AZURE_OPENAI_ENDPOINT"
    - "AZURE_OPENAI_DEPLOYMENT"
  extras: ["openai"]
